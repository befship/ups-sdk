# UPS REST API manifest.
# Specs are downloaded at generate time from UPS-API/api-documentation (never committed).
# Prefer *-Ready.yaml when both exist. package = Go dir under internal/generated/.
#
# server_cie / server_prod override broken or missing official servers entries.

spec_repo: https://raw.githubusercontent.com/UPS-API/api-documentation/main

